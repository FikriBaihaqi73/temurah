<svg width='1200' height='630' viewBox='0 0 1200 630' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#09090b'/>
      <stop offset='50%' stop-color='#18181b'/>
      <stop offset='100%' stop-color='#09090b'/>
    </linearGradient>
    <linearGradient id='primary' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#ef4444'/>
      <stop offset='100%' stop-color='#dc2626'/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width='1200' height='630' fill='url(#bg)'/>
  <circle cx='1050' cy='120' r='350' fill='#dc2626' opacity='0.08'/>
  <circle cx='150' cy='520' r='280' fill='#ef4444' opacity='0.05'/>

  <!-- Header Badge -->
  <rect x='80' y='70' width='54' height='54' rx='14' fill='url(#primary)'/>
  <text x='107' y='107' font-family='system-ui, sans-serif' font-size='28' fill='#ffffff' text-anchor='middle'>🏷️</text>
  <text x='150' y='109' font-family='system-ui, sans-serif' font-size='38' font-weight='900' fill='#ffffff' letter-spacing='-1'>Temurah</text>
  
  <rect x='830' y='72' width='290' height='46' rx='23' fill='#dc2626' fill-opacity='0.15' stroke='#dc2626' stroke-opacity='0.35'/>
  <text x='975' y='102' font-family='system-ui, sans-serif' font-size='16' font-weight='700' fill='#f87171' text-anchor='middle'>🔥 Validasi Komunitas Warga</text>

  <!-- Main Headline -->
  <text x='80' y='240' font-family='system-ui, sans-serif' font-size='56' font-weight='900' fill='#f4f4f5' letter-spacing='-1.5'>
    Temukan &amp; Bagikan Diskon
  </text>
  <text x='80' y='310' font-family='system-ui, sans-serif' font-size='56' font-weight='900' fill='#f4f4f5' letter-spacing='-1.5'>
    Harga Sembako &amp; Supermarket
  </text>

  <!-- Subtitle -->
  <text x='80' y='380' font-family='system-ui, sans-serif' font-size='22' fill='#a1a1aa'>
    Informasi promo riil terdekat yang dipantau dan dibuktikan langsung oleh warga sekitar.
  </text>
  <text x='80' y='415' font-family='system-ui, sans-serif' font-size='22' fill='#a1a1aa'>
    Bebas penipuan harga coret dan manipulasi diskon.
  </text>

  <!-- Tags / Pills -->
  <g transform='translate(80, 480)'>
    <rect x='0' y='0' width='290' height='54' rx='12' fill='#18181b' stroke='#27272a'/>
    <text x='145' y='34' font-family='system-ui, sans-serif' font-size='18' fill='#e4e4e7' text-anchor='middle'>🛒 Superindo &amp; Minimarket</text>

    <rect x='310' y='0' width='260' height='54' rx='12' fill='#18181b' stroke='#27272a'/>
    <text x='440' y='34' font-family='system-ui, sans-serif' font-size='18' fill='#e4e4e7' text-anchor='middle'>🥬 Pasar Tradisional</text>

    <rect x='590' y='0' width='280' height='54' rx='12' fill='#18181b' stroke='#27272a'/>
    <text x='730' y='34' font-family='system-ui, sans-serif' font-size='18' fill='#e4e4e7' text-anchor='middle'>🛍️ Marketplace Online</text>
  </g>
